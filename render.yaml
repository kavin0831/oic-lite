services:
  - type: web
    name: oic-lite-broker
    runtime: python
    plan: free
    rootDir: broker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AGENT_REGISTRATION_TOKEN
        generateValue: true
      - key: CLIENT_API_KEY
        generateValue: true
      - key: DEFAULT_UI_GROUP
        value: EBS-PROD-1
